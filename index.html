<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>초등 3부 햇살반 · 수업 도구</title>
<style>
  :root {
    --bg: #F6F1E1;
    --ink: #2C3E50;
    --ink-soft: rgba(44, 62, 80, 0.68);
    --line: rgba(44, 62, 80, 0.16);
    --sun: #E9A82B;
    --tap: 56px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    scrollbar-gutter: stable;
  }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Nanum Gothic", system-ui, sans-serif;
    font-size: 20px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    max-width: none;
    margin: 0;
    padding:
      20px
      max(20px, env(safe-area-inset-right, 0px), calc((100vw - 1100px) / 4 + 20px))
      32px
      max(20px, env(safe-area-inset-left, 0px), calc((100vw - 1100px) / 4 + 20px));
  }

  /* 맨 위: 반 이름과 날짜 */
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding-bottom: 18px;
    border-bottom: 3px solid var(--sun);
  }
  h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .today {
    margin: 0;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 600;
    color: var(--ink-soft);
  }

  .h1-en {
    margin: 0;
    font-size: clamp(18px, 2.8vw, 28px);
    font-weight: 700;
    color: var(--ink-soft);
    line-height: 1.3;
  }
  .today-en {
    margin: 0;
    font-size: clamp(17px, 2.4vw, 24px);
    font-weight: 600;
    color: var(--ink-soft);
    line-height: 1.3;
  }
  .en { display: block; font-weight: 600; line-height: 1.3; }
  .fs-en { display: block; font-size: 12px; font-weight: 600; line-height: 1.2; opacity: 0.8; }

  header { position: relative; }
  #fs {
    position: absolute;
    top: 0;
    right: 0;
    min-height: 52px;
    padding: 4px 17px;
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #fs[hidden] { display: none; }
  #fs:active { background: rgba(44, 62, 80, 0.08); }
  #fs:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  /* 탭 */
  [role="tablist"] {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    container-type: inline-size;
    margin: 22px 0 0;
    padding: 0;
  }
  [role="tab"] {
    flex: 1 1 0;
    min-width: 0;
    min-height: 68px;
    padding: 8px 4px;
    font: inherit;
    font-size: clamp(13px, 1.75vw, 26px);
    font-size: clamp(13px, 1.8cqw, 26px);
    font-weight: 800;
    line-height: 1.25;
    white-space: nowrap;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  [role="tab"] .en {
    font-size: clamp(10px, 1.25vw, 16px);
    font-weight: 600;
    color: inherit;
    opacity: 0.8;
  }
  [role="tab"]:active { background: rgba(44, 62, 80, 0.08); }
  [role="tab"][aria-selected="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  [role="tab"]:focus-visible,
  [role="tabpanel"]:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 3px;
  }

  /* 내용 */
  [role="tabpanel"] {
    margin-top: 18px;
    min-height: 46vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
    border: 2px dashed var(--line);
    border-radius: 18px;
  }
  [role="tabpanel"][hidden] { display: none; }
  .panel-title {
    margin: 0 0 8px;
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 800;
  }
  .panel-note {
    margin: 0;
    font-size: clamp(20px, 3vw, 26px);
    color: var(--ink-soft);
  }
  .panel-title-en {
    margin: 0 0 14px;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 700;
    color: var(--ink-soft);
  }
  .panel-note-en {
    margin: 4px 0 0;
    font-size: clamp(17px, 2.4vw, 22px);
    color: var(--ink-soft);
  }

  /* 성경 이야기 탭 */
  [role="tabpanel"].story:not([hidden]) {
    display: block;
    min-height: 0;
    padding: 0;
    border: none;
  }
  .scene { margin: 0; border-radius: 28px; overflow: hidden; background: #FFF6E0; line-height: 0; }
  .scene svg { display: block; width: 100%; height: auto; }
  .scene svg { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .drag, .drag * { touch-action: none; }
  .drag { cursor: grab; }
  .drag.dragging { cursor: grabbing; }
  .scene-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 0 0 14px; }
  .scene-btn {
    width: 60px;
    min-height: 60px;
    padding: 0;
    font: inherit;
    font-size: 28px;
    font-weight: 800;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .scene-btn:active { background: rgba(44, 62, 80, 0.08); }
  .scene-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .scene-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .scene-title { margin: 0 0 0 8px; font-size: clamp(24px, 3.2vw, 34px); font-weight: 900; line-height: 1.3; }
  .scene-view[hidden] { display: none; }
  .scene-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 46vh;
    padding: 24px;
    border: 2px dashed var(--line);
    border-radius: 18px;
    font-size: clamp(22px, 3vw, 28px);
    color: var(--ink-soft);
    text-align: center;
  }
  .story-actions { display: flex; justify-content: center; margin-top: 16px; }

  /* 함께 생각해 볼까요? */
  .think { margin-top: 22px; }
  .think-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    min-height: 68px;
    padding: 8px 24px;
    font: inherit;
    font-size: clamp(24px, 3vw, 30px);
    font-weight: 900;
    color: var(--ink);
    background: #FFF3D6;
    border: 2px solid var(--line);
    border-radius: 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .think-toggle:active { background: #F6E2B0; }
  .think-toggle:focus-visible, .think-card:focus-visible, .tf-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .think-chevron {
    width: 14px;
    height: 14px;
    border-right: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
    transform: translateY(-4px) rotate(45deg);
    transition: transform 0.15s;
  }
  .think-toggle[aria-expanded="true"] .think-chevron { transform: translateY(4px) rotate(-135deg); }
  .think-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
  .think-cards[hidden] { display: none; }
  .think-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    min-height: 170px;
    padding: 22px 22px 24px;
    font: inherit;
    text-align: left;
    color: var(--ink);
    background: var(--c);
    border: 0;
    border-radius: 26px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s;
  }
  .think-card:active { transform: scale(.98); }
  .think-num, .tf-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    font-size: 26px;
    font-weight: 900;
  }
  .think-q { font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; line-height: 1.45; word-break: keep-all; }

  .think-full {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    background: var(--c, #FFF3D6);
    color: var(--ink);
    padding: max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    touch-action: pan-y;
  }
  .think-full[hidden] { display: none; }
  .tf-top { display: flex; justify-content: flex-end; }
  .tf-btn {
    min-height: 64px;
    min-width: 64px;
    padding: 0 28px;
    font: inherit;
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.65);
    border: 2px solid rgba(44, 62, 80, 0.2);
    border-radius: 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tf-btn:active { background: rgba(255, 255, 255, 0.95); }
  .tf-btn:disabled { opacity: .35; cursor: default; }
  .tf-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; padding: 8px 4vw; }
  .tf-num { width: clamp(72px, 9vw, 110px); height: clamp(72px, 9vw, 110px); font-size: clamp(40px, 5.4vw, 66px); }
  .tf-q { margin: 0; max-width: 1200px; font-size: clamp(38px, 6.6vw, 92px); font-weight: 900; line-height: 1.35; word-break: keep-all; }
  .tf-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .tf-nav .tf-btn { min-height: 72px; min-width: 150px; font-size: 30px; }
  .tf-dots { display: flex; gap: 12px; }
  .tf-dots span { width: 16px; height: 16px; border-radius: 50%; background: rgba(44, 62, 80, 0.25); }
  .tf-dots span.on { background: var(--ink); }
  .reset-btn {
    min-height: 60px;
    padding: 0 40px;
    font: inherit;
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    background: #FFF3D6;
    border: 2px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .reset-btn:active { background: #F6E2B0; }
  .reset-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  /* 공과 탭 */
  [role="tabpanel"].lesson:not([hidden]) {
    display: block;
    min-height: 0;
    padding: 0;
    border: none;
    text-align: center;
  }
  .cover {
    padding: clamp(26px, 4.5vw, 52px) clamp(12px, 2vw, 24px);
    border-radius: 32px;
    background:
      radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.65) 0 90px, transparent 91px),
      linear-gradient(135deg, #FFDCC0 0%, #FFEFB5 48%, #D5EFDF 100%);
    word-break: keep-all;
  }
  .cover-title {
    margin: 0;
    font-size: clamp(50px, 10vw, 96px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .cover-sub {
    margin: 10px 0 0;
    font-size: clamp(28px, 4.8vw, 44px);
    font-weight: 700;
  }
  .cover-title-en {
    margin: 4px 0 0;
    font-size: clamp(26px, 4.6vw, 46px);
    font-weight: 800;
    color: var(--ink-soft);
    line-height: 1.2;
  }
  .cover-sub-en {
    margin: 4px 0 0;
    font-size: clamp(20px, 3.4vw, 32px);
    font-weight: 700;
    color: var(--ink-soft);
  }
  .q-line { display: block; white-space: nowrap; }
  .q-en {
    display: block;
    margin-top: 6px;
    font-size: clamp(15px, calc((100vw - 170px) / 24), 30px);
    font-weight: 700;
    color: var(--ink-soft);
    line-height: 1.35;
  }
  .stack {
    display: grid;
    justify-content: center;
    row-gap: 24px;
    margin-top: 28px;
  }
  .cover-question {
    margin: 0;
    padding: 18px 28px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.72);
    font-size: clamp(22px, calc((100vw - 170px) / 17.5), 46px);
    font-weight: 800;
    line-height: 1.45;
  }
  .verse {
    margin: 0;
    width: 0;
    min-width: 100%;
    padding: clamp(24px, 4vw, 44px) clamp(18px, 2.6vw, 34px);
    border-radius: 28px;
    background: #FFFCF2;
    color: var(--ink);
    border: none;
    box-shadow: none;
  }
  .verse { text-align: left; }
  .verse-head {
    margin: 0 0 14px;
    font-size: clamp(26px, 3.8vw, 40px);
    font-weight: 900;
    line-height: 1.3;
  }
  .verse-text {
    margin: 0;
    font-size: clamp(24px, 3.4vw, 38px);
    font-weight: 700;
    line-height: 1.75;
  }
  .vn {
    margin: 0 5px 0 2px;
    font-size: 0.55em;
    font-weight: 800;
    line-height: 0;
    color: rgba(44, 62, 80, 0.6);
  }
  .stack > .verse-src {
    width: 0;
    min-width: 100%;
    margin: 0;
    text-align: center;
  }

  .verse-src {
    margin: 8px 0 0;
    font-size: clamp(16px, 2vw, 19px);
    font-weight: 600;
    color: rgba(44, 62, 80, 0.62);
  }
  .verse-en {
    margin-top: clamp(20px, 3vw, 30px);
    padding-top: clamp(20px, 3vw, 30px);
    border-top: 2px solid var(--line);
    word-break: normal;
  }
  .verse-en .verse-text { font-size: clamp(22px, 3.1vw, 34px); font-weight: 600; line-height: 1.65; }
  .verse-en .verse-head { font-size: clamp(22px, 3.2vw, 32px); font-weight: 800; }

  .flow {
    margin-top: 22px;
    text-align: left;
    border: 2px solid var(--line);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.55);
    overflow: hidden;
  }
  .flow > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 64px;
    padding: 10px 22px;
    font-size: 24px;
    font-weight: 800;
    cursor: pointer;
    list-style: none;
    touch-action: manipulation;
  }
  .flow > summary::-webkit-details-marker { display: none; }
  .flow > summary:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }
  .sum-hint {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .sum-hint::after {
    content: "";
    width: 12px;
    height: 12px;
    border-right: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    transform: translateY(-3px) rotate(45deg);
    transition: transform 0.15s;
  }
  .flow[open] .sum-hint::after { transform: translateY(3px) rotate(-135deg); }
  .flow .when-open { display: none; }
  .flow[open] .when-open { display: inline; }
  .flow[open] .when-closed { display: none; }

  .flow-list { list-style: none; margin: 0; padding: 0; }
  .flow-list li { border-top: 1px solid var(--line); }
  .step .sub { display: block; font-size: 16px; font-weight: 600; color: var(--ink-soft); line-height: 1.3; }
  .flow > summary .sub { font-size: 17px; font-weight: 600; color: var(--ink-soft); }
  .step {
    display: grid;
    grid-template-columns: 130px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    padding: 14px 22px;
    margin: 0;
    font: inherit;
    font-size: 22px;
    color: var(--ink);
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 0;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.15s;
  }
  .step:active { background: rgba(44, 62, 80, 0.08); }
  .step:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }
  .step[aria-pressed="true"] { background: #FBE3A0; }
  .stage { font-weight: 800; }
  .mins { font-weight: 800; text-align: right; }
  .now {
    display: none;
    margin-left: 12px;
    padding: 2px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 18px;
    font-weight: 800;
    vertical-align: 2px;
  }
  .step[aria-pressed="true"] .now { display: inline-block; }
  .step[aria-pressed="true"] .what { font-weight: 800; }

  @media (prefers-reduced-motion: reduce) {
    .sum-hint::after { transition: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    [role="tab"] { transition: none; }
  }

  /* ===== 퀴즈 ===== */
  [role="tabpanel"].quiz:not([hidden]) { display: block; min-height: 0; padding: 0; border: none; text-align: left; }
  .quiz [hidden] { display: none !important; }
  .qz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .qz-progress { padding: 8px 24px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: clamp(22px, 3vw, 30px); font-weight: 900; }
  .qz-score { display: flex; align-items: center; gap: 8px; padding: 4px 22px; border-radius: 999px; background: #FFF0B8; border: 3px solid #F2C94C; font-size: clamp(26px, 3.6vw, 38px); font-weight: 900; }
  .qz-score .qz-star, .qz-score .qz-n { display: inline-block; }
  .qz-score .qz-n { min-width: 1.1ch; text-align: center; }
  .qz-score.pop .qz-star, .qz-score.pop .qz-n { animation: qz-pop .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes qz-pop { 0% { transform: scale(1); } 35% { transform: scale(1.8) rotate(-10deg); } 100% { transform: scale(1); } }
  .qz-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .qz-bar span { flex: 1; height: 12px; border-radius: 6px; background: rgba(44, 62, 80, 0.15); }
  .qz-bar span.now { background: #F2C94C; }
  .qz-bar span.ok { background: #2E9E5B; }
  .qz-bar span.no { background: #E0524D; }
  .qz-card { padding: clamp(18px, 3vw, 32px); border-radius: 28px; background: #FFF8E6; }
  .qz-ref { margin: 0 0 8px; font-size: clamp(18px, 2.3vw, 24px); font-weight: 700; color: var(--ink-soft); }
  .qz-q { margin: 0 0 clamp(16px, 2.4vw, 26px); font-size: clamp(28px, 4.4vw, 48px); font-weight: 900; line-height: 1.4; word-break: keep-all; }
  .qz-choices { display: grid; gap: 14px; }
  .qz-choice {
    display: flex; align-items: center; gap: 16px; width: 100%;
    min-height: clamp(84px, 11vh, 112px); padding: 14px 22px;
    font: inherit; font-size: clamp(24px, 3.4vw, 36px); font-weight: 800; text-align: left; word-break: keep-all;
    color: var(--ink); background: #FFFFFF; border: 4px solid rgba(44, 62, 80, 0.2); border-radius: 22px;
    cursor: pointer; touch-action: manipulation;
    transition: transform .1s, opacity .25s, background-color .2s, border-color .2s;
  }
  .qz-choice:active:not(:disabled) { transform: scale(.98); background: #FFF3D6; }
  .qz-choice:focus-visible, .qz-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .qz-choice .qz-no { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 30px; font-weight: 900; }
  .qz-choice:disabled { cursor: default; color: var(--ink); }
  .qz-choice.right { background: #D7F3E1; border-color: #2E9E5B; }
  .qz-choice.right .qz-no { background: #2E9E5B; }
  .qz-choice.wrong { background: #FDE0DE; border-color: #E0524D; }
  .qz-choice.wrong .qz-no { background: #E0524D; }
  .qz-choice.dim { opacity: .35; }
  .qz-feedback { margin-top: 18px; padding: 18px 24px; border-radius: 20px; font-size: clamp(22px, 3vw, 32px); font-weight: 700; line-height: 1.5; word-break: keep-all; }
  .qz-feedback.right { background: #D7F3E1; }
  .qz-feedback.wrong { background: #FDE0DE; }
  .qz-verdict { display: block; margin-bottom: 6px; font-size: clamp(28px, 4vw, 42px); font-weight: 900; }
  .qz-src { display: block; margin-top: 8px; font-size: clamp(18px, 2.3vw, 24px); font-weight: 700; color: var(--ink-soft); }
  .qz-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 20px; }
  .qz-btn { min-height: 72px; padding: 0 40px; font: inherit; font-size: clamp(24px, 3.2vw, 32px); font-weight: 900; border: 3px solid var(--ink); border-radius: 20px; cursor: pointer; touch-action: manipulation; }
  .qz-next { background: var(--ink); color: var(--bg); }
  .qz-next:disabled { opacity: .3; cursor: default; }
  .qz-next.ready { animation: qz-nudge 1.2s ease-in-out infinite; }
  @keyframes qz-nudge { 50% { transform: translateY(-5px); } }
  .qz-restart { background: #FFF3D6; color: var(--ink); border-color: rgba(44, 62, 80, 0.3); }
  .qz-result { padding: clamp(24px, 4vw, 44px) 16px; border-radius: 28px; background: #FFF8E6; text-align: center; }
  .qz-trophy { font-size: clamp(90px, 16vw, 170px); line-height: 1.1; animation: qz-bob 1.8s ease-in-out infinite; }
  @keyframes qz-bob { 50% { transform: translateY(-10px) scale(1.04); } }
  .qz-rtitle { margin: 8px 0; font-size: clamp(34px, 6vw, 64px); font-weight: 900; }
  .qz-rtext { margin: 0; font-size: clamp(24px, 3.4vw, 36px); font-weight: 700; }
  .qz-line { display: flex; flex-wrap: nowrap; justify-content: center; gap: clamp(6px, 1.6vw, 16px); margin-top: 24px; }
  .qz-cell { flex: 1 1 0; max-width: 130px; min-width: 0; padding: 8px 2px; border-radius: 18px; background: #FFFFFF; border: 3px solid rgba(44, 62, 80, 0.15); }
  .qz-cell.ok { background: #EAF9EF; border-color: #2E9E5B; }
  .qz-cell .qz-cn { display: block; font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; color: var(--ink-soft); }
  .qz-cell .qz-cs { display: block; font-size: clamp(34px, 6vw, 60px); line-height: 1.1; font-weight: 900; }
  .qz-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; }
  .qz-fx[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .qz-trophy, .qz-next.ready { animation: none; }
    .qz-score.pop .qz-star, .qz-score.pop .qz-n { animation: none; }
  }

  /* ===== 짝 맞추기 ===== */
  [role="tabpanel"].match:not([hidden]) { display: block; min-height: 0; padding: 0; border: none; text-align: left; }
  .match [hidden] { display: none !important; }
  .mt-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 14px; }
  .mt-level { display: flex; gap: 8px; }
  .mt-lv, .mt-shuffle { min-height: 68px; padding: 0 26px; font: inherit; font-size: clamp(22px, 2.8vw, 30px); font-weight: 900; color: var(--ink); background: transparent; border: 3px solid rgba(44, 62, 80, 0.28); border-radius: 18px; cursor: pointer; touch-action: manipulation; }
  .mt-lv[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .mt-shuffle { background: #FFF3D6; }
  .mt-lv:active, .mt-shuffle:active { background: #F6E2B0; }
  .mt-lv[aria-pressed="true"]:active { background: var(--ink); }
  .mt-lv:focus-visible, .mt-shuffle:focus-visible, .mt-card:focus-visible, .mt-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .mt-stats { display: flex; flex-wrap: wrap; gap: 10px; }
  .mt-stat { padding: 8px 22px; border-radius: 999px; background: #FFF0B8; border: 3px solid #F2C94C; font-size: clamp(22px, 2.8vw, 30px); font-weight: 900; }
  .mt-stat b { display: inline-block; min-width: 1ch; font-size: 1.2em; }
  .mt-stat.pop b { animation: qz-pop .6s cubic-bezier(.2, 1.6, .4, 1); }

  /* 큰 축하 화면 (카드 위에 화면 전체로 덮음) */
  .mt-win { position: fixed; inset: 0; z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vh, 24px); padding: 24px; background: rgba(255, 248, 230, 0.95); text-align: center; }
  .mt-emo { font-size: clamp(90px, 20vw, 240px); line-height: 1; animation: qz-bob 1.6s ease-in-out infinite; }
  .mt-big { font-size: clamp(44px, 9vw, 128px); font-weight: 900; line-height: 1.15; word-break: keep-all; }
  .mt-sub { font-size: clamp(26px, 4vw, 56px); font-weight: 700; line-height: 1.3; word-break: keep-all; }
  .mt-stars { font-size: clamp(48px, 9vw, 110px); line-height: 1.1; letter-spacing: .1em; }
  .mt-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 12px; }
  .mt-btn { min-height: 88px; padding: 0 52px; font: inherit; font-size: clamp(28px, 3.6vw, 44px); font-weight: 900; border: 3px solid var(--ink); border-radius: 24px; cursor: pointer; touch-action: manipulation; }
  .mt-again { background: var(--ink); color: var(--bg); }
  .mt-look { background: #FFF3D6; color: var(--ink); border-color: rgba(44, 62, 80, 0.3); }

  /* 카드판: 남은 화면을 가득 채움 (높이는 자바스크립트가 --mt-h 로 정함) */
  .mt-grid { --mt-u: 200px; --mt-w: 240px; --mt-ch: 240px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: clamp(10px, 1.6vw, 22px); height: var(--mt-h, auto); min-height: 320px; }
  .mt-card { position: relative; display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; font: inherit; color: var(--ink); cursor: pointer; perspective: 1000px; touch-action: manipulation; }
  .mt-card.up, .mt-card.matched { cursor: default; }
  .mt-inner { position: absolute; inset: 0; display: block; transition: transform .55s cubic-bezier(.3, 1.25, .5, 1); transform-style: preserve-3d; }
  .mt-card.up .mt-inner, .mt-card.matched .mt-inner { transform: rotateY(180deg); }
  .mt-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: clamp(16px, 2.4vw, 30px); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .mt-back { background: linear-gradient(145deg, #FFC9A8, #FFE08A); border: 4px solid #F2A65A; box-shadow: 0 6px 0 rgba(150, 100, 40, 0.25); }
  .mt-card:not(.up):not(.matched):active .mt-back { filter: brightness(.94); }
  .mt-num { font-size: calc(var(--mt-u) * .5); font-weight: 900; line-height: 1; color: #FFFFFF; text-shadow: 0 4px 0 rgba(150, 90, 30, 0.38); }
  .mt-front { transform: rotateY(180deg); padding: 8px; background: #FFFFFF; border: 4px solid rgba(44, 62, 80, 0.2); text-align: center; }
  .mt-card.matched .mt-front { background: #E4F6EB; border-color: #2E9E5B; }
  .mt-no { position: absolute; top: calc(var(--mt-u) * .04); left: calc(var(--mt-u) * .07); font-size: max(14px, calc(var(--mt-u) * .075)); font-weight: 800; color: var(--ink-soft); }
  .mt-emoji { display: block; font-size: min(calc(var(--mt-ch) * .34), calc(var(--mt-w) * .4)); line-height: 1.12; }
  .mt-emoji.multi { font-size: min(calc(var(--mt-ch) * .17), calc(var(--mt-w) * .15)); }
  .mt-word { display: block; margin-top: calc(var(--mt-ch) * .02); font-size: min(calc(var(--mt-ch) * .12), calc(var(--mt-w) * .115)); font-weight: 900; line-height: 1.22; word-break: keep-all; }
  .mt-line { display: block; }
  .mt-chest { display: block; height: calc(var(--mt-ch) * .5); width: auto; max-width: calc(var(--mt-w) * .8); margin: 0 auto; }
  .mt-baskets { display: block; width: min(calc(var(--mt-w) * .84), calc(var(--mt-ch) * .48 * 1.6)); height: auto; margin: 0 auto; }
  .mt-net { display: block; width: min(calc(var(--mt-w) * .8), calc(var(--mt-ch) * .46 * 1.54)); height: auto; margin: 0 auto; }
  .mt-coins { display: block; width: min(calc(var(--mt-w) * .8), calc(var(--mt-ch) * .46 * 1.79)); height: auto; margin: 0 auto; }
  .mt-card.bump { animation: mt-bump .5s ease; }
  .mt-card.shake { animation: mt-shake .45s ease; }
  @keyframes mt-bump { 40% { transform: scale(1.07); } }
  @keyframes mt-shake { 20% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 80% { transform: translateX(-4px); } }
  @media (prefers-reduced-motion: reduce) {
    .mt-inner { transition: none; }
    .mt-card.bump, .mt-card.shake, .mt-stat.pop b, .mt-emo { animation: none; }
  }

  /* ===== 찬양 ===== */
  [role="tabpanel"].praise:not([hidden]) { display: block; min-height: 0; padding: 0; border: none; text-align: left; }
  .pr-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; }
  .pr-card { display: flex; flex-direction: column; padding: clamp(18px, 2.6vw, 32px); border-radius: 28px; background: #FFF1DC; }
  .pr-card-2 { background: #E6F0FA; }
  .pr-tag { align-self: flex-start; margin: 0 0 8px; padding: 4px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: clamp(18px, 2.2vw, 24px); font-weight: 800; }
  .pr-title { margin: 0 0 12px; font-size: clamp(36px, 5vw, 64px); font-weight: 900; line-height: 1.15; letter-spacing: -0.01em; }
  .pr-video { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 20px; background: var(--ink); }
  .pr-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 16px; text-align: center; color: #FFFFFF; font-size: clamp(18px, 2.2vw, 26px); font-weight: 700; line-height: 1.4; word-break: keep-all; }
  .pr-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .pr-open { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 84px; margin-top: 16px; padding: 0 24px; border-radius: 22px; background: #C8372D; color: #FFFFFF; font-size: clamp(26px, 3.2vw, 38px); font-weight: 900; text-decoration: none; touch-action: manipulation; }
  .pr-open:active { background: #A62B23; }
  .pr-open:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  /* ===== 공과: 성경 구절 카드를 가로로 넓게 ===== */
  .verses { display: grid; gap: 20px; margin-top: 24px; }
  .verses .verse { width: auto; min-width: 0; padding: clamp(16px, 2.4vw, 30px) clamp(16px, 2.8vw, 36px); border-radius: 26px; }
  .verses .verse-head { margin: 0 0 8px; font-size: clamp(24px, 2.8vw, 34px); }
  .verses .verse-text { font-size: clamp(22px, 2.5vw, 32px); line-height: 1.6; }
  .verses .verse-en { margin-top: clamp(12px, 1.8vw, 20px); padding-top: clamp(12px, 1.8vw, 20px); }
  .verses .verse-en .verse-head { font-size: clamp(20px, 2.3vw, 28px); }
  .verses .verse-en .verse-text { font-size: clamp(19px, 2.1vw, 28px); line-height: 1.55; }
  .verses .verse-src { margin: 0; text-align: center; }

    document.addEventListener("fullscreenchange", function () {
      fsBtn.innerHTML = document.fullscreenElement
        ? '<span>전체화면 끝내기</span><span class="fs-en" lang="en">Exit full screen</span>'
        : '<span>전체화면</span><span class="fs-en" lang="en">Full screen</span>';
    });
  }

  select(0, false);
})();
</script>
</body>
</html>
